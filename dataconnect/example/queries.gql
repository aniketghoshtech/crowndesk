mutation InsertPatient($data: Patient_Data!) @auth(level: USER) {
  patient_insert(data: $data)
}

mutation UpsertPatient($data: Patient_Data!) @auth(level: USER) {
  patient_upsert(data: $data)
}

mutation DeletePatient($id: UUID!) @auth(level: USER) {
  patient_delete(id: $id)
}

mutation UpdatePatient($id: UUID!, $data: Patient_Data!) @auth(level: USER) {
  patient_update(id: $id, data: $data)
}

query GetPatient($id: UUID!) @auth(level: USER) {
  patient(id: $id) {
    firstName
    lastName
    email
  }
}

query ListPatients @auth(level: USER) {
  patients {
    firstName
    lastName
  }
}

